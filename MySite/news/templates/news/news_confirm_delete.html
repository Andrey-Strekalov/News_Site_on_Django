{% extends 'base.html' %}

{% block title %}Удаление новости :: {{ block.super }}{% endblock %}

{% block content %}
<h2>Вы уверены, что хотите удалить новость "{{ news.title }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'view_news' news.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
